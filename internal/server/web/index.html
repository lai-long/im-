<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地 IM · 群聊</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f3f5; }
  #app { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #3a6ea5; color: #fff; font-weight: 600; }
  #body { flex: 1; display: flex; min-height: 0; }
  aside { width: 200px; border-right: 1px solid #e0e0e0; background: #fafbfc; overflow-y: auto; }
  .chat-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #eef0f2; font-size: 13px; }
  .chat-item:hover { background: #eef4fb; }
  .chat-item.active { background: #dbe9f7; font-weight: 600; }
  .chat-item .kind { color: #888; font-size: 11px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .msg { margin: 8px 0; }
  .msg .meta { color: #888; font-size: 12px; }
  .msg .meta .bot-tag { background: #3a6ea5; color: #fff; border-radius: 3px; padding: 0 4px; font-size: 11px; margin-right: 4px; }
  .msg .content { white-space: pre-wrap; word-break: break-word; }
  .msg .at { color: #c0392b; font-weight: 600; }
  .msg .typing { color: #2e9e5b; font-size: 12px; }
  .msg-img { max-width: 240px; max-height: 240px; border-radius: 6px; }
  .news { border: 1px solid #e6e8eb; border-radius: 6px; padding: 8px 10px; margin: 4px 0; }
  .news a { font-weight: 600; color: #1a73e8; text-decoration: none; }
  .news-desc { color: #666; font-size: 13px; margin-top: 2px; }
  .card { border: 1px solid #d6e4ff; background: #f5f9ff; border-radius: 6px; padding: 8px 10px; }
  footer { display: flex; gap: 8px; padding: 10px 16px; background: #fff; border-top: 1px solid #e0e0e0; }
  #input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 18px; border: 0; border-radius: 6px; background: #3a6ea5; color: #fff; cursor: pointer; }
  #login { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
  #login .panel { background: #fff; padding: 24px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 10px; }
  #login select, #login input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>本地 IM（企微机器人 / 自建应用联调）</header>
  <div id="body">
    <aside id="chats"></aside>
    <div id="main">
      <div id="msgs"></div>
      <footer>
        <input id="input" placeholder="群内 @机器人 触发回调；应用会话直接发消息" autocomplete="off">
        <button id="send">发送</button>
      </footer>
    </div>
  </div>
</div>
<div id="login">
  <div class="panel">
    <strong>选择或注册用户</strong>
    <select id="preset"></select>
    <input id="nickname" placeholder="或输入新昵称自动注册">
    <button id="enter">进入</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let me = null;

async function boot() {
  const users = await (await fetch('/api/users')).json();
  const sel = $('#preset');
  users.forEach(u => {
    const o = document.createElement('option');
    o.value = u.userid; o.textContent = u.name + '（' + u.userid + '）';
    sel.appendChild(o);
  });
  $('#enter').onclick = async () => {
    const body = $('#nickname').value.trim()
      ? { name: $('#nickname').value.trim() }
      : { userid: sel.value };
    me = await (await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) })).json();
    localStorage.setItem('im-user', JSON.stringify(me));
    $('#login').remove();
    connect();
  };
  const saved = localStorage.getItem('im-user');
  if (saved) {
    me = JSON.parse(saved);
    $('#login').remove();
    connect();
  }
}

let activeChatId = null;

async function loadChats() {
  const chats = await (await fetch(`/api/chats?userid=${me.userid}`)).json();
  const el = $('#chats');
  el.innerHTML = chats.map(c => `
    <div class="chat-item${c.id === activeChatId ? ' active' : ''}" data-id="${c.id}">
      ${escapeHtml(c.name)}
      <div class="kind">${c.type === 'direct' ? '应用单聊' : '群聊'}</div>
    </div>`).join('');
  el.querySelectorAll('.chat-item').forEach(item => {
    item.onclick = () => { activeChatId = Number(item.dataset.id); loadChats(); loadHistory(); };
  });
  if (!activeChatId && chats.length) { activeChatId = chats[0].id; loadChats(); loadHistory(); }
}

function render(m) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.dataset.msgid = m.msgid;
  const tag = m.sender_type === 'bot' ? '<span class="bot-tag">bot</span>' : '';
  const time = new Date(m.ts / 1000).toLocaleTimeString();
  const typing = (m.msgtype === 'stream' && m.content && m.content.finish === false) ? ' <span class="typing">生成中…</span>' : '';
  div.innerHTML = `<div class="meta">${tag}${m.sender} · ${time}${typing}</div><div class="content">${bodyHtml(m)}</div>`;
  $('#msgs').appendChild(div);
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
}

// bodyHtml 按消息类型生成安全 HTML。
function bodyHtml(m) {
  const c = m.content || {};
  const at = s => escapeHtml(s).replace(/(@[^\s，,。@]+)/g, '<span class="at">$1</span>');
  switch (m.msgtype) {
    case 'image':
      return `<img class="msg-img" src="data:image/png;base64,${escapeAttr(c.base64 || '')}">`;
    case 'news': {
      const arts = Array.isArray(c.articles) ? c.articles : [];
      return arts.map(a => `<div class="news"><a href="${escapeAttr(a.url || '#')}" target="_blank">${escapeHtml(a.title || '')}</a>` +
        `<div class="news-desc">${escapeHtml(a.description || '')}</div></div>`).join('');
    }
    case 'template_card': {
      const t = c.card_type || '';
      const title = (c.main_title && c.main_title.title) || '';
      return `<div class="card"><b>卡片·${escapeHtml(t)}</b><div>${escapeHtml(title)}</div></div>`;
    }
    case 'file':
      return `<a href="/api/media/${escapeAttr(c.media_id || '')}">📎 文件 ${escapeAttr(c.media_id || '')}</a>`;
    case 'voice':
      return `<a href="/api/media/${escapeAttr(c.media_id || '')}">🔊 语音 ${escapeAttr(c.media_id || '')}</a>`;
    default:
      return at(c.content || '');
  }
}

// renderStream 流式全量刷新：按 msgid 覆盖已有气泡，未渲染过则追加
function renderStream(m) {
  const exist = document.querySelector(`.msg[data-msgid="${CSS.escape(m.msgid)}"]`);
  if (exist) { exist.remove(); render(m); return; }
  render(m);
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
// escapeAttr 用于属性上下文（URL 等）。
function escapeAttr(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let ws = null, retry = 0;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?user=${me.userid}`);
  ws.onopen = () => { retry = 0; loadHistory(); };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.kind === 'message') { loadChats(); if (ev.message.chat_id === activeChatId) render(ev.message); }
    if (ev.kind === 'stream') { if (ev.message.chat_id === activeChatId) renderStream(ev.message); }
  };
  ws.onclose = () => { setTimeout(connect, Math.min(1000 * ++retry, 5000)); };
}

async function loadHistory() {
  if (!activeChatId) return;
  const msgs = await (await fetch(`/api/messages?limit=100&chat_id=${activeChatId}`)).json();
  $('#msgs').innerHTML = '';
  msgs.forEach(m => render(m));
}

async function send() {
  const text = $('#input').value.trim();
  if (!text) return;
  await fetch('/api/send', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ userid: me.userid, text, chat_id: activeChatId }) });
  $('#input').value = '';
}

$('#send').onclick = send;
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
boot();
</script>
</body>
</html>
